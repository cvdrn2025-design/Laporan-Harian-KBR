<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Harian TBM</title>
<style>
:root{--g:#3ddc3a;--gd:#1f8f1d;--d:#14191a;--d2:#252b2c;--bg:#d9dcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Barlow","Segoe UI",Roboto,Arial,sans-serif;color:#1b1f20}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--d);justify-content:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--d);z-index:10}
.bar button{font:600 14px inherit;font-family:inherit;border:0;border-radius:6px;padding:9px 13px;background:var(--d2);color:#fff;cursor:pointer}
.bar button.p{background:var(--g);color:#06210a}
.bar button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:1px}
.wrap{overflow-x:auto;padding:10px 0 30px;display:flex;justify-content:center}
.sheet{width:794px;background:#f4f6f5;box-shadow:0 4px 20px #0005;flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
input,textarea{font:inherit;color:inherit;border:0;background:transparent;width:100%;padding:2px 4px;border-radius:3px}
input:hover,input:focus{background:#3ddc3a22}
.head{background:var(--d);color:#fff;padding:14px 22px;display:flex;gap:16px;align-items:center;border-bottom:2px solid var(--g)}
.logo{width:150px;height:84px;flex:none;position:relative;cursor:pointer}
.logo img{width:100%;height:100%;object-fit:contain}
.logo svg{width:100%;height:100%}
.hn input{color:var(--g);font-size:30px;font-weight:800;letter-spacing:1px;padding:0}
.hn .t input{color:#cfe;font-size:14px;letter-spacing:5px;margin-top:2px}
.meta{background:var(--d2);color:#fff;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 22px}
.meta small{color:#9ab;font-size:12px;display:block}
.meta input{font-weight:700;font-size:16px;padding:1px 0}
.meta input[type=date]{color-scheme:dark;font-size:13px;width:auto;margin-top:2px}
.body{padding:12px 22px 0}
.title{display:flex;align-items:stretch;background:var(--d);color:#fff;margin-bottom:10px}
.title h1{margin:0;font-size:34px;padding:8px 14px;flex:none;font-weight:800}
.title .tbm{background:var(--g);color:#06210a;padding:2px 18px;text-align:center;flex:none}
.title .tbm b{font-size:38px;line-height:1.1;display:block}
.title .tbm span{font-size:10px;font-weight:700}
.grid{display:grid;gap:10px;margin-bottom:10px}
.g3{grid-template-columns:1fr 1.15fr 1.15fr}.g2{grid-template-columns:1fr 1fr}
.card{background:#fff;border:1px solid #c5cbcb}
.ch{background:var(--d);color:#fff;font-weight:800;font-size:15px;padding:6px 10px;display:flex;align-items:center;gap:8px;border-left:5px solid var(--g)}
.ch em{font-style:normal;background:var(--g);color:#06210a;border-radius:3px;padding:0 7px}
.cb{padding:6px 8px}
.row{display:flex;gap:4px;align-items:center;padding:2px 4px;border-radius:3px;position:relative}
.row:nth-child(odd){background:#eef1f1}
.row .n{flex:1;font-size:13px}.row .v{width:90px;text-align:right;font-weight:800;font-size:13px}
.row.l input.n{font-size:13px}
.x,.add{border:0;cursor:pointer;font:700 12px inherit;font-family:inherit}
.x{background:#e44;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;padding:0;flex:none}
.add{background:#e6f8e6;color:var(--gd);border-radius:4px;padding:4px 8px;margin-top:4px}
.cuaca{text-align:center;padding:12px 6px}.wi{font-size:46px;line-height:1.1}.cuaca select{font-weight:800;font-size:19px;font-family:inherit;border:1px solid #c5cbcb;border-radius:6px;background:#fff;padding:4px 6px;margin:4px 0;max-width:100%;color:#1b1f20}
.cuaca input{text-align:center}.cuaca .m{font-size:30px;font-weight:800}.cuaca .s{font-size:12px;color:#666}
.num{width:20px;height:20px;border:1.5px solid var(--gd);color:var(--gd);border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.chk{width:18px;height:18px;accent-color:var(--gd);flex:none}
.kond{display:flex;justify-content:space-around;padding:10px}
.kond label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px;cursor:pointer}
.foto{background:#cfd3d3;height:250px;display:grid;place-items:center;cursor:pointer;color:#555;font-size:14px;overflow:hidden}
.foto img{width:100%;height:250px;object-fit:cover}
.fg{display:grid;gap:4px;background:#fff}.fg.n1{grid-template-columns:1fr}.fg.n2{grid-template-columns:1fr 1fr}.fg.n3{grid-template-columns:1fr 1fr 1fr}
.fi{position:relative;height:200px;break-inside:avoid}.fg.n1 .fi{height:260px}.fi img{width:100%;height:100%;object-fit:cover;display:block}.fi .x{position:absolute;top:5px;right:5px}
.info{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;background:var(--d);color:#dfe;padding:8px 22px;font-size:12px;margin-top:10px}
.info small{color:var(--g);font-weight:700;display:block}
.info input{padding:0;font-size:12px;color:#fff}
.foot{background:var(--d);color:#aab;text-align:center;font-size:11px;padding:7px;border-top:3px solid #e9c500;letter-spacing:1px}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;place-items:center;padding:16px}
.modal.on{display:grid}
.mb{background:#fff;border-radius:10px;width:min(480px,100%);max-height:80vh;overflow:auto;padding:16px}
.mb h2{margin:0 0 10px;font-size:18px}
.it{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #ddd;font-size:14px}
.it span{flex:1}.it button{border:0;border-radius:5px;padding:6px 10px;cursor:pointer;background:#e6f8e6;color:#14611a;font-weight:600}.it button.r{background:#fde4e4;color:#a11}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:30;display:none}
@media (prefers-color-scheme:dark){body{background:#2a2e2f}}
@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff}body::before,.bar,.x,.add,.modal,.toast{display:none!important}
 .wrap{padding:0;display:block;overflow:visible}.sheet{zoom:1!important;box-shadow:none;width:210mm}
 input:hover,input:focus{background:transparent}input[type=date]{display:none}
 .foto .ph{display:none}
 .cuaca select{appearance:none;-webkit-appearance:none;border-color:transparent;background:transparent;text-align:center;text-align-last:center}
}
</style>
</head>
<body>
<div class="bar">
 <button onclick="newDoc()">Laporan baru</button>
 <button class="p" onclick="saveDoc()">Simpan</button>
 <button onclick="openList()">Buka tersimpan</button>
 <button onclick="exportJson()">Ekspor file</button>
 <button onclick="$('#imp').click()">Impor file</button>
 <button class="p" onclick="window.print()">Cetak / PDF</button>
 <input id="imp" type="file" accept=".json" hidden>
</div>
<div class="wrap"><div class="sheet" id="sheet"></div></div>
<div class="modal" id="modal"><div class="mb"><h2>Laporan tersimpan</h2><div id="list"></div><p><button onclick="$('#modal').classList.remove('on')" style="border:0;border-radius:6px;padding:8px 14px;cursor:pointer">Tutup</button></p></div></div>
<div class="toast" id="toast"></div>
<input id="fp" type="file" accept="image/*" multiple hidden><input id="fl" type="file" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const blank=()=>({id:'',company:'PT. KARYA BAJATAMA RAYA',tag:'CONTRACTOR, DESIGNER & SUPPLIER',project:'VINFAS INDONESIA DEPOT 3 KEMAYORAN',date:iso(),
cuaca:'Cerah',cuacaSub:'(Pagi Cerah Siang - Sore -)',
tenaga:[['Staff Teknis','4 Orang'],['Divisi Sipil','20 Orang'],['Divisi Besi','5 Orang'],['Harian Kantor','1 Orang'],['Operator Excavator','2 Orang']],
alat:[['Excavator','2 Unit'],['Cutting Wheel','1 Unit'],['Mesin Las','1 Unit'],['Gerinda','1 Unit'],['Alat Ukur TS (Total Station)','1 Unit']],
rencana:['Fabrikasi bekisting untuk GTT','Pekerjaan kupas beton lama','Perapian galian di dalam GTT','Tembak elevasi lapangan / titik as galian GTT / U-ditch','Gali tanah untuk U-ditch'],
materi:[['Menghimbau untuk menggunakan APD lengkap di lapangan',1],['Dilarang merokok di area pekerjaan',1],['Jagalah keselamatan di tempat kerja',1],['Percepatan schedule pekerjaan',1]],
kondisi:'Cerah',fotos:[],logo:'',lokasi:'NO.1B Jl Rajawali Selatan Raya Gunung Sahari Utara Sawah Besar Jakarta 10720',koordinat:'6.145339°S 106.838152°E',jam:'08:01'});
let S;try{S=JSON.parse(localStorage.getItem('tbm_draft'))}catch(e){}
const mig=o=>{if(o.foto){o.fotos=(o.fotos||[]).concat(o.foto);delete o.foto}o.fotos=o.fotos||[];return o};S=mig(S||blank());
const KS='tbm_reports';
const W={'Cerah':'☀️','Berawan':'⛅','Hujan Ringan':'🌦️','Hujan Lebat':'🌧️'};
const getAll=()=>{try{return JSON.parse(localStorage.getItem(KS))||{}}catch(e){return{}}};
const fmt=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).replace(/^(\w+) /,'$1, ').replace(/,,/,',')}catch(e){return d}};
const hari=d=>fmt(d).split(',')[0];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function draft(){try{localStorage.setItem('tbm_draft',JSON.stringify(S))}catch(e){toast('Foto terlalu besar untuk draf otomatis; tekan Simpan')}}
const inp=(p,v,c='',t='text')=>`<input type="${t}" data-p="${p}" value="${esc(v)}" class="${c}">`;
const list=(k,cls)=>S[k].map((r,i)=>`<div class="row ${cls||''}">${inp(k+'.'+i+'.0',r[0],'n')}${inp(k+'.'+i+'.1',r[1],'v')}<button class="x" data-del="${k}.${i}" title="Hapus">×</button></div>`).join('')+`<button class="add" data-add="${k}">+ Tambah baris</button>`;
function render(){
$('#sheet').innerHTML=`
<div class="head"><div class="logo" id="lg" title="Klik untuk ganti logo">${S.logo?`<img src="${S.logo}">`:`<svg viewBox="0 0 150 84"><ellipse cx="75" cy="42" rx="70" ry="38" fill="#0b1a0c" stroke="#3ddc3a" stroke-width="4"/><ellipse cx="75" cy="42" rx="30" ry="38" fill="none" stroke="#3ddc3a" stroke-width="2"/><path d="M5 42h140" stroke="#3ddc3a" stroke-width="2"/><text x="75" y="55" text-anchor="middle" font-family="Arial" font-weight="900" font-size="38" fill="#3ddc3a" stroke="#0b1a0c" stroke-width="3" paint-order="stroke">KBR</text></svg>`}</div>
<div class="hn" style="flex:1">${inp('company',S.company)}<div class="t">${inp('tag',S.tag)}</div></div></div>
<div class="meta"><div><small>PROYEK</small>${inp('project',S.project)}</div><div><small>TANGGAL</small><b id="df" style="font-size:16px">${esc(fmt(S.date))}</b><br>${inp('date',S.date,'','date')}</div></div>
<div class="body">
<div class="title"><h1>LAPORAN HARIAN</h1><div class="tbm"><b>TBM</b><span>(TOOLBOX MEETING)</span></div></div>
<div class="grid g3">
<div class="card"><div class="ch"><em>1</em> CUACA</div><div class="cuaca"><div class="wi">${W[S.kondisi]||'☀️'}</div><select id="wsel" aria-label="Kondisi cuaca">${Object.keys(W).map(k=>`<option value="${k}" ${S.kondisi===k?'selected':''}>${W[k]} ${k}</option>`).join('')}</select>${inp('cuacaSub',S.cuacaSub,'s')}</div></div>
<div class="card"><div class="ch"><em>2</em> TENAGA KERJA</div><div class="cb">${list('tenaga')}</div></div>
<div class="card"><div class="ch"><em>3</em> ALAT KERJA</div><div class="cb">${list('alat')}</div></div></div>
<div class="grid g2">
<div class="card"><div class="ch"><em>4</em> RENCANA KERJA</div><div class="cb">${S.rencana.map((r,i)=>`<div class="row l"><span class="num">${i+1}</span>${inp('rencana.'+i,r)}<button class="x" data-del="rencana.${i}">×</button></div>`).join('')}<button class="add" data-add="rencana">+ Tambah rencana</button></div></div>
<div class="card"><div class="ch"><em>5</em> MATERI TBM (TOOLBOX MEETING)</div><div class="cb">${S.materi.map((r,i)=>`<div class="row l"><input type="checkbox" class="chk" style="width:18px" data-p="materi.${i}.1" ${r[1]?'checked':''}>${inp('materi.'+i+'.0',r[0])}<button class="x" data-del="materi.${i}">×</button></div>`).join('')}<button class="add" data-add="materi">+ Tambah materi</button></div></div></div>
<div class="card"><div class="ch">FOTO DOKUMENTASI TBM PAGI</div>${S.fotos.length?`<div class="fg n${Math.min(S.fotos.length,3)}">${S.fotos.map((f,i)=>`<div class="fi"><img src="${f}"><button class="x" data-df="${i}" title="Hapus foto">×</button></div>`).join('')}</div>`:'<div class="foto" id="ft0"><span class="ph">Ketuk untuk menambah foto dokumentasi</span></div>'}<div class="cb"><button class="add" id="ft">+ Tambah foto (bisa pilih banyak)</button></div></div>
</div>
<div class="info"><div><small>Lokasi</small>${inp('lokasi',S.lokasi)}</div><div><small>Koordinat</small>${inp('koordinat',S.koordinat)}</div><div><small>Waktu</small><b id="wk">${esc(hari(S.date))}<br>${esc(fmt(S.date).split(', ')[1]||'')} ${esc(S.jam)}</b><br>${inp('jam',S.jam,'','time')}</div></div>
<div class="foot">${esc(S.company)} • CONTRACTOR, DESIGNER &amp; SUPPLIER</div>`;
fit()}
function setP(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k.at(-1)]=v}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;setP(p,t.type==='checkbox'?(t.checked?1:0):t.value);
if(p==='date'||p==='jam'){$('#df').textContent=fmt(S.date);$('#wk').innerHTML=esc(hari(S.date))+'<br>'+esc(fmt(S.date).split(', ')[1]||'')+' '+esc(S.jam)}
if(p==='company')document.querySelector('.foot').innerHTML=esc(S.company)+' • CONTRACTOR, DESIGNER &amp; SUPPLIER';draft()});
document.addEventListener('click',e=>{const t=e.target;
if(t.dataset.del){const[k,i]=t.dataset.del.split('.');S[k].splice(+i,1);render();draft()}
else if(t.dataset.add){const k=t.dataset.add;S[k].push(k==='rencana'?'':k==='materi'?['',1]:['','']);render();draft()}
else if(t.dataset.k){S.kondisi=t.dataset.k;S.cuaca=t.dataset.k;render();draft()}
else if(t.dataset.df){S.fotos.splice(+t.dataset.df,1);render();draft()}
else if(t.closest('#ft,#ft0'))$('#fp').click();else if(t.closest('#lg'))$('#fl').click()});
function img(file,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL(file.type==='image/png'&&max<500?'image/png':'image/jpeg',.82))};i.src=r.result};r.readAsDataURL(file)}
$('#fp').onchange=e=>{const fs=[...e.target.files];e.target.value='';let n=0;fs.forEach(f=>img(f,1000,d=>{S.fotos.push(d);if(++n===fs.length){render();draft()}}))};
$('#fl').onchange=e=>{const f=e.target.files[0];if(f)img(f,400,d=>{S.logo=d;render();draft()});e.target.value=''};
function saveDoc(){const a=getAll();S.id=S.id||('r'+Date.now());a[S.id]=JSON.parse(JSON.stringify(S));try{localStorage.setItem(KS,JSON.stringify(a));draft();toast('Laporan tersimpan')}catch(e){toast('Penyimpanan penuh. Hapus laporan lama atau gunakan Ekspor file.')}}
function newDoc(){if(!confirm('Mulai laporan baru? Perubahan yang belum disimpan akan hilang.'))return;const o=S;S=blank();S.company=o.company;S.tag=o.tag;S.project=o.project;S.logo=o.logo;S.lokasi=o.lokasi;S.koordinat=o.koordinat;S.tenaga=o.tenaga.map(r=>[r[0],'']);S.alat=o.alat.map(r=>[r[0],'']);S.materi=o.materi;S.rencana=[''];render();draft()}
function openList(){const a=Object.values(getAll()).sort((x,y)=>y.date.localeCompare(x.date));
$('#list').innerHTML=a.length?a.map(r=>`<div class="it"><span><b>${esc(fmt(r.date))}</b><br><small>${esc(r.project)}</small></span><button data-open="${r.id}">Buka</button><button class="r" data-rm="${r.id}">Hapus</button></div>`).join(''):'<p>Belum ada laporan tersimpan. Tekan Simpan untuk menyimpan laporan ini.</p>';
$('#modal').classList.add('on')}
$('#list').addEventListener('click',e=>{const a=getAll(),o=e.target.dataset.open,r=e.target.dataset.rm;
if(o){S=mig(a[o]);render();draft();$('#modal').classList.remove('on')}
if(r&&confirm('Hapus laporan ini?')){delete a[r];localStorage.setItem(KS,JSON.stringify(a));openList()}});
function exportJson(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='TBM_'+S.date+'.json';a.click();toast('Jika unduhan tidak berjalan, gunakan Simpan di browser')}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=mig(Object.assign(blank(),JSON.parse(t)));render();draft();toast('Laporan diimpor')}catch(x){toast('File tidak valid')}});e.target.value=''};
function fit(){const z=Math.min(1,(innerWidth-8)/794);$('#sheet').style.zoom=z}
addEventListener('resize',fit);
document.addEventListener('change',e=>{if(e.target.id==='wsel'){S.kondisi=S.cuaca=e.target.value;render();draft()}});
render();
</script>
</body>
</html>
